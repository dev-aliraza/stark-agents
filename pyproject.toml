[project]
name = "stark-agents"
version = "0.3.0"
description = "A lightweight Python ADK for discovering and orchestrating multi-agent workflows"
dynamic = ["readme"]
license = "Apache-2.0"
authors = [{name = "Ali Raza", email = "dev.aliraza@gmail.com"}]
keywords = ["agent", "ai agent", "adk", "mcp", "orchestration", "asynchronous", "AI"]
dependencies = [
    "litellm==1.96.2",
    "mcp==2.0.0",
    "pyyaml==6.0.3",
]
requires-python = ">=3.10"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "https://github.com/dev-aliraza/stark-agents"
Repository = "https://github.com/dev-aliraza/stark-agents"
Issues = "https://github.com/dev-aliraza/stark-agents/issues"

[project.scripts]
stark = "stark.__main__:main"

[project.optional-dependencies]
slack = ["slack-bolt>=1.21.0", "aiohttp>=3.9"]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling==1.26.3", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Fail the suite on any deprecated API call. Module-scoped filters do not work here:
# a `@deprecated` async context manager reports `contextlib` as its origin, not the
# caller. The tree is warning-free today, so if a dependency later adds one of its own,
# add a targeted "ignore::DeprecationWarning:<module>" line beside these.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # mcp 2.x raises its own MCPDeprecationWarning, which subclasses UserWarning rather
  # than DeprecationWarning — the filters above would miss it entirely.
  "error::mcp.MCPDeprecationWarning",
]

[tool.hatch.build]
include = [
  "src/*"
]

[tool.hatch.build.targets.wheel]
packages = ["src/stark"]

[tool.hatch.build.targets.sdist]
# Basically everything except hidden files/directories (such as .github, .devcontainers, .python-version, etc)
include = [
  "/*.toml",
  "/*.json",
  "/*.lock",
  "/*.md",
  "/mypy.ini",
  "/noxfile.py",
  "bin/*",
  "examples/*",
  "src/*",
  "tests/*",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
